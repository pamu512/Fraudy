services:
  backend:
    build:
      context: ./fraud-analyzer-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      - FRAUDY_API_KEY=${FRAUDY_API_KEY:?FRAUDY_API_KEY must be set}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
